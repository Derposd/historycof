name: VPS

# Установка тестового стенда на VPS заказчика по SSH.
# Репозиторий публичный: всё, что сервер сообщает о себе, шифруется ключом,
# производным от секрета VPS_SSH_KEY, и в логе виден только шифротекст.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'inspect — только осмотр; deploy — установка/обновление'
        required: true
        default: inspect
        type: choice
        options: [inspect, deploy]
      host:
        description: 'Адрес сервера'
        required: true
      user:
        description: 'Пользователь SSH'
        required: true
        default: root
      port:
        description: 'Порт SSH'
        required: true
        default: '22'

concurrency: vps

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_SSH_KEY" ]; then echo "::error::Секрет VPS_SSH_KEY не задан"; exit 1; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/vps && chmod 600 ~/.ssh/vps
          # Ключ шифрования отчётов: sha256 от тела приватного ключа без пробелов и переводов строк
          REPORT_KEY=$(printf '%s' "$VPS_SSH_KEY" | tr -d ' \r\n' | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$REPORT_KEY"
          echo "REPORT_KEY=$REPORT_KEY" >> "$GITHUB_ENV"
          cat > ~/.ssh/config <<CFG
          Host vps
            HostName ${{ inputs.host }}
            User ${{ inputs.user }}
            Port ${{ inputs.port }}
            IdentityFile ~/.ssh/vps
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
            ConnectTimeout 20
          CFG
          # Отпечаток ключа (публичная информация) — чтобы убедиться, что в секрете нужный ключ
          echo "Отпечаток ключа из секрета: $(ssh-keygen -y -f ~/.ssh/vps | ssh-keygen -lf - | awk '{print $2}')"
          ssh -o BatchMode=yes vps true && echo "Подключение есть"

      - name: Осмотр (только чтение)
        if: inputs.action == 'inspect'
        run: |
          ssh vps 'bash -s' < deploy/inspect.sh > report.txt 2>&1 || true
          echo "Отчёт зашифрован. Строка для расшифровки:"
          echo "REPORT_BEGIN"
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:REPORT_KEY -in report.txt | base64 -w0
          echo
          echo "REPORT_END"

      - name: Установка / обновление стенда
        if: inputs.action == 'deploy'
        run: |
          # Образы собираем здесь, на раннере: на сервере 1 ядро и 2 ГБ, сборка там
          # могла бы помешать соседнему приложению
          docker build -t historycoffee-backend:test backend
          docker build -t historycoffee-admin:test admin
          docker save historycoffee-backend:test historycoffee-admin:test | gzip -1 > /tmp/hc-images.tar.gz
          ls -lh /tmp/hc-images.tar.gz
          git archive --format=tar.gz -o /tmp/hc-release.tgz HEAD
          # Секреты стенда хранятся в репозитории только в зашифрованном виде
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:REPORT_KEY -in deploy/secrets.env.enc -out /tmp/hc-secrets.env
          scp -q /tmp/hc-images.tar.gz /tmp/hc-release.tgz /tmp/hc-secrets.env deploy/server-deploy.sh vps:/tmp/
          rm -f /tmp/hc-secrets.env
          ssh vps "chmod 600 /tmp/hc-secrets.env && mv /tmp/server-deploy.sh /tmp/hc-deploy.sh && HC_HOST='${{ inputs.host }}' bash /tmp/hc-deploy.sh; code=\$?; rm -f /tmp/hc-deploy.sh; exit \$code"
