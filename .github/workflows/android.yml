name: Android APK

# Собирает APK на раннере GitHub (там есть Android SDK и доступ к Google Maven).
# Готовый файл — во вкладке Actions → запуск → Artifacts.
# Тег версии (v*) — постоянный релиз с тестовой и демо-сборкой: к нему всегда можно вернуться.
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Адрес API (пусто — демо-сборка без сервера)'
        required: false
        default: ''
      snapshot:
        description: 'Снимок версии: имя тега (например v1.0-2026-09-29) — постоянный релиз с тестовой и демо-сборкой'
        required: false
        default: ''

concurrency: android-${{ github.ref }}

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # публикация демо-APK в релиз
    defaults: { run: { working-directory: mobile } }
    env:
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.47.5, cache: true }
      - run: flutter pub get
      - run: flutter test

      # Ключ подписи из секретов репозитория (если заданы). Без них — debug-подпись:
      # APK ставится на телефон для проверки, но в Google Play его не загрузить.
      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.HAS_RELEASE_KEY == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Сборка
        env:
          API_URL: ${{ inputs.api_url || vars.API_URL }}
          IS_TAG: ${{ github.ref_type == 'tag' || inputs.snapshot != '' }}
        run: |
          mkdir -p out
          # build <имя> <dart-define...>: универсальный APK, лёгкий arm64 и AAB для Google Play
          build() {
            local name=$1; shift
            flutter build apk --release "$@"
            cp build/app/outputs/flutter-apk/app-release.apk "out/$name.apk"
            # Лёгкий APK только для arm64 — подходит почти всем современным телефонам
            flutter build apk --release --split-per-abi --target-platform android-arm64 "$@"
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "out/$name-arm64.apk"
            flutter build appbundle --release "$@"
            cp build/app/outputs/bundle/release/app-release.aab "out/$name.aab"
          }
          # Для тега собираем обе версии; адрес тестового стенда — по умолчанию
          if [ "$IS_TAG" = true ] && [ -z "$API_URL" ]; then API_URL=http://168.113.210.120:8090/api/v1; fi
          if [ -n "$API_URL" ]; then
            # Тестовый стенд без HTTPS: разрешаем http только в такой сборке
            case "$API_URL" in http://*) export ALLOW_CLEARTEXT=true ;; esac
            build history-coffee "--dart-define=API_URL=$API_URL"
            unset ALLOW_CLEARTEXT
          fi
          if [ -z "$API_URL" ] || [ "$IS_TAG" = true ]; then
            build history-coffee-demo --dart-define=DEMO=true
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: history-coffee-android
          path: mobile/out/*
          retention-days: 30

      # Рабочая тестовая сборка (с адресом сервера) — в отдельный пре-релиз.
      - name: Опубликовать тестовый APK
        if: ${{ github.ref_type != 'tag' && !inputs.snapshot && (inputs.api_url || vars.API_URL) }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete android-test --cleanup-tag --yes || true
          gh release create android-test out/history-coffee.apk out/history-coffee-arm64.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "History Coffee — тестовая сборка для Android" \
            --notes "Рабочая тестовая сборка, подключена к тестовому серверу. Сборка из ${GITHUB_SHA::7}."

      # Демо-сборка (без сервера) публикуется в пре-релиз с постоянной ссылкой —
      # её можно открыть с телефона без входа в GitHub.
      - name: Опубликовать демо-APK
        if: ${{ github.ref_type != 'tag' && !inputs.snapshot && !(inputs.api_url || vars.API_URL) }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete android-demo --cleanup-tag --yes || true
          gh release create android-demo out/history-coffee-demo.apk out/history-coffee-demo-arm64.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "History Coffee — демо для Android" \
            --notes "Демо-версия без сервера: примерные данные, вход по любому номеру с кодом 1234. Сборка из ${GITHUB_SHA::7}."

      # Снимок версии: постоянный релиз под тегом, новые сборки его не перезаписывают.
      - name: Опубликовать снимок версии
        if: ${{ github.ref_type == 'tag' || inputs.snapshot != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.snapshot || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[A-Za-z0-9._-]+$ ]]; then echo "::error::Имя снимка должно начинаться с v"; exit 1; fi
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Релиз $TAG уже есть"; exit 0; fi
          # Тег создаётся вместе с релизом на текущем коммите
          gh release create "$TAG" out/* --target "$GITHUB_SHA" \
            --title "History Coffee $TAG — снимок версии" \
            --notes "Сохранённая версия приложения из ${GITHUB_SHA::7}. history-coffee*.apk — подключена к тестовому стенду, history-coffee-demo*.apk — демо без сервера, .aab — для Google Play. Вернуть стенд к этой версии: workflow VPS → deploy, в поле ветки выбрать тег $TAG."
