name: Android APK

# Собирает APK на раннере GitHub (там есть Android SDK и доступ к Google Maven).
# Готовый файл — во вкладке Actions → запуск → Artifacts.
on:
  push:
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Адрес API (пусто — демо-сборка без сервера)'
        required: false
        default: ''

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # публикация демо-APK в релиз
    defaults: { run: { working-directory: mobile } }
    env:
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.47.5, cache: true }
      - run: flutter pub get
      - run: flutter test

      # Ключ подписи из секретов репозитория (если заданы). Без них — debug-подпись:
      # APK ставится на телефон для проверки, но в Google Play его не загрузить.
      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.HAS_RELEASE_KEY == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Сборка
        env:
          API_URL: ${{ inputs.api_url || vars.API_URL }}
        run: |
          if [ -n "$API_URL" ]; then
            DEFINES="--dart-define=API_URL=$API_URL"
            NAME=history-coffee
            # Тестовый стенд без HTTPS: разрешаем http только в такой сборке
            case "$API_URL" in http://*) export ALLOW_CLEARTEXT=true ;; esac
          else
            DEFINES="--dart-define=DEMO=true"
            NAME=history-coffee-demo
          fi
          flutter build apk --release $DEFINES
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/universal.apk
          # Лёгкий APK только для arm64 — подходит почти всем современным телефонам
          flutter build apk --release --split-per-abi --target-platform android-arm64 $DEFINES
          flutter build appbundle --release $DEFINES
          mkdir -p out
          cp /tmp/universal.apk "out/$NAME.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "out/$NAME-arm64.apk"
          cp build/app/outputs/bundle/release/app-release.aab "out/$NAME.aab"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: history-coffee-android
          path: mobile/out/*
          retention-days: 30

      # Рабочая тестовая сборка (с адресом сервера) — в отдельный пре-релиз.
      - name: Опубликовать тестовый APK
        if: ${{ inputs.api_url || vars.API_URL }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete android-test --cleanup-tag --yes || true
          gh release create android-test out/history-coffee.apk out/history-coffee-arm64.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "History Coffee — тестовая сборка для Android" \
            --notes "Рабочая тестовая сборка, подключена к тестовому серверу. Сборка из ${GITHUB_SHA::7}."

      # Демо-сборка (без сервера) публикуется в пре-релиз с постоянной ссылкой —
      # её можно открыть с телефона без входа в GitHub.
      - name: Опубликовать демо-APK
        if: ${{ !(inputs.api_url || vars.API_URL) }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete android-demo --cleanup-tag --yes || true
          gh release create android-demo out/history-coffee-demo.apk out/history-coffee-demo-arm64.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "History Coffee — демо для Android" \
            --notes "Демо-версия без сервера: примерные данные, вход по любому номеру с кодом 1234. Сборка из ${GITHUB_SHA::7}."
